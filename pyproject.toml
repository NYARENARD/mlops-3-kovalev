[tool.poetry]
name = "mlops-data-kovalev"
version = "0.1.0"
description = "DVC and ClearML data versioning practice"
authors = ["Kovalev"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
dvc = "3.67.1"
clearml = "2.1.12"
scikit-learn = "1.9.1"
pandas = "3.0.6"
numpy = "2.5.3"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"